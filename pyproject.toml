[project]
name = "rl_blockchain"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
default-groups = []
dependencies = [
    "distrax>=0.1.7",
    "flax>=0.12.4",
    "jax[cuda13]>=0.9.0.1",
    "jraph>=0.0.6.dev0",
    "matplotlib>=3.10.3",
    "networkx>=3.4.2",
    "optax>=0.2.6",
    "tqdm>=4.67.1",
    "wandb>=0.19.11",
    "gymnax",
]

[tool.uv]
# Ensure the lockfile always resolves to wheels installable on Linux x86_64
# (local machine + HPC). Without this, uv can lock a Windows-only wheel
# (e.g. tensorboard-plugin-profile 2.22.3) that fails to install here.
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
default-groups = []

[dependency-groups]
dev = [
    "notebook>=7.4.2",
    "snakeviz>=2.2.2",
    "tensorboard>=2.19.0",
    "tensorboard-plugin-profile>=2.19.6",
    "pytest>=8.3.5",
]
